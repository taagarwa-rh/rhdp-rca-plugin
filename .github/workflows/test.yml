name: test

on:
  pull_request:
    branches: [stage, feat/ci-testing]
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Claude Code
        env:
          APP_CREDENTIALS: ${{ secrets.GCP_APP_CREDENTIALS }}
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p /home/runner/.config/gcloud
          echo "$APP_CREDENTIALS" > /home/runner/.config/gcloud/adc.json
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install special dependencies
        run: |
          pip install -r tests/requirements.txt

      - name: Run tests
        id: test
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.config/gcloud/adc.json
          CLAUDE_CODE_USE_VERTEX: 1
          CLOUD_ML_REGION: us-east5
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.ANTHROPIC_VERTEX_PROJECT_ID }}
          ANTHROPIC_MODEL: claude-sonnet-4-6@default
        run: |
          SCORE=$(python tests/run_tests.py --tags ci -o test_results.json)
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"

      - name: Extract cost
        id: cost
        run: |
          COST=$(python -c "import json; print(json.load(open('test_results.json'))['costs']['costUSD'])")
          echo "costUSD=$COST" >> "$GITHUB_OUTPUT"

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.json

      - name: Extract failures table
        id: failures
        run: |
          TABLE=$(python -c "
          import json
          failures = json.load(open('test_results.json')).get('failures', [])
          if failures:
              lines = ['| Input | Assertion | Result | Reasoning |', '|-------|-----------|--------|-----------|']
              for f in failures:
                  lines.append(f'| {f[\"input\"]} | {f[\"assertion\"]} | {f[\"result\"]} | {f[\"reasoning\"]} |')
              print('\n'.join(lines))
          ")
          echo "table<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TABLE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: |
          echo "## Skill Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Score | ${{ steps.test.outputs.score }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cost | \$${{ steps.cost.outputs.costUSD }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.failures.outputs.table }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failures" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.failures.outputs.table }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const failuresTable = `${{ steps.failures.outputs.table }}`;
            const failuresSection = failuresTable ? `\n\n### Failures\n\n${failuresTable}` : '';
            const body = `## Skill Test Results\n\n| Metric | Value |\n|--------|-------|\n| Score | ${{ steps.test.outputs.score }} |\n| Cost | \$${{ steps.cost.outputs.costUSD }} |${failuresSection}\n\n*Results from commit ${{ github.sha }}*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Skill Test Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check score
        run: |
          echo "Test score: ${{ steps.test.outputs.score }}"
          if [ "$(echo '${{ steps.test.outputs.score }} < 1.00' | bc -l)" -eq 1 ]; then
            echo "::error::Test score ${{ steps.test.outputs.score }} is below 1.00"
            exit 1
          fi

