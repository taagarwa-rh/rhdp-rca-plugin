name: test

on:
  pull_request:
    branches: [stage, feat/ci-testing]
    
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Claude Code
        env:
          APP_CREDENTIALS: ${{ secrets.GCP_APP_CREDENTIALS }}
        run: |
          npm install -g @anthropic-ai/claude-code
          mkdir -p /home/runner/.config/gcloud
          echo "$APP_CREDENTIALS" > /home/runner/.config/gcloud/adc.json
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install special dependencies
        run: |
          pip install -r tests/requirements.txt

      - name: Run tests
        id: test
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/.config/gcloud/adc.json
          CLAUDE_CODE_USE_VERTEX: 1
          CLOUD_ML_REGION: us-east5
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.ANTHROPIC_VERTEX_PROJECT_ID }}
          ANTHROPIC_MODEL: claude-sonnet-4-6@default
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest tests/ --junitxml=test_results.xml -v || true

      - name: Parse test results
        id: results
        run: |
          python -c "
          import xml.etree.ElementTree as ET

          tree = ET.parse('test_results.xml')
          root = tree.getroot()

          testsuite = root if root.tag == 'testsuite' else root.find('testsuite')
          total = int(testsuite.get('tests', 0))
          failures = int(testsuite.get('failures', 0))
          errors = int(testsuite.get('errors', 0))
          passed = total - failures - errors

          if total > 0:
              pct = int((passed / total) * 100)
              score = f'{pct}% ({passed}/{total})'
          else:
              score = '0% (0/0)'

          total_cost = 0.0
          for testcase in root.iter('testcase'):
              for prop in testcase.iter('property'):
                  if prop.get('name') == 'cost':
                      total_cost += float(prop.get('value', 0))

          failed_tests = []
          for testcase in root.iter('testcase'):
              failure = testcase.find('failure')
              if failure is not None:
                  name = testcase.get('name', '')
                  classname = testcase.get('classname', '')
                  message = failure.get('message', '').replace('|', '\\|')
                  failed_tests.append((classname, name, message))

          table = ''
          if failed_tests:
              lines = ['| Class | Test | Failure |', '|-------|------|---------|']
              for cls, name, msg in failed_tests:
                  lines.append(f'| {cls} | {name} | {msg} |')
              table = '\n'.join(lines)

          import os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'score={score}\n')
              f.write(f'costUSD={total_cost:.4f}\n')
              f.write(f'table<<EOF\n{table}\nEOF\n')
          "

      - name: Archive test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.xml

      - name: Job summary
        run: |
          echo "## Skill Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Score | ${{ steps.results.outputs.score }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cost | \$${{ steps.results.outputs.costUSD }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.results.outputs.table }}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failures" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.results.outputs.table }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const failuresTable = `${{ steps.results.outputs.table }}`;
            const failuresSection = failuresTable ? `\n\n### Failures\n\n${failuresTable}` : '';
            const body = `## Skill Test Results\n\n| Metric | Value |\n|--------|-------|\n| Score | ${{ steps.results.outputs.score }} |\n| Cost | \$${{ steps.results.outputs.costUSD }} |${failuresSection}\n\n*Results from commit ${{ github.sha }}*`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Skill Test Results'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check score
        run: |
          echo "Test score: ${{ steps.results.outputs.score }}"
          if [[ "${{ steps.results.outputs.score }}" != 100%* ]]; then
            echo "::error::Test score ${{ steps.results.outputs.score }} is below 100%"
            exit 1
          fi

